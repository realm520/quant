  exchanges:
    xt:
      metrics:
        perp_balance_volatility:
          type: balance_volatility
          window_minutes: 1440         # 统计窗口（分钟）
          warning_threshold: 0.01      # 1% 波动率触发预警
          critical_threshold: 0.015    # 1.5% 波动率触发严重告警
          lark_webhook: ${LARK_WEBHOOK_URL}
          lark_secret: ${LARK_WEBHOOK_SECRET:-}
        perp_risk_ratio:
          type: risk_ratio             # 基于维持保证金与可用保证金的风险率
          warning_threshold: 0.6       # 风险率 >= 0.6 触发预警
          critical_threshold: 0.8      # 风险率 >= 0.8 触发严重告警
          asset: USDT                  # 使用的保证金资产

