# Tri-Arb Configuration Example
# Copy this file to config.yaml and customize as needed

app:
  name: tri-arb
  log_level: INFO
  environment: development

database:
  path: tri_arb.db
  pool_size: 5
  timeout: 5.0
  # Enable WAL mode for better concurrent access
  wal_mode: true

cache:
  # TTL in seconds for cached data
  ttl: 60
  # Maximum number of cached items
  max_size: 1000
  # Cache strategy: ttl (time-based) or lru (least recently used)
  strategy: ttl

performance:
  max_concurrent_requests: 10
  request_timeout: 30
  # Enable uvloop for better async performance
  use_uvloop: true

exchanges:
  # Binance configuration (placeholder - not functional in MVP)
  - name: binance
    enabled: false
    base_url: https://api.binance.com
    ws_url: wss://stream.binance.com:9443

  # OKX configuration (placeholder - not functional in MVP)
  - name: okx
    enabled: false
    base_url: https://www.okx.com
    ws_url: wss://ws.okx.com:8443

monitoring:
  # Prometheus metrics endpoint port
  metrics_port: 9090
  # Health check interval in seconds
  health_check_interval: 30
  # Enable metrics collection
  enable_metrics: true
  # Metrics to track
  track_requests: true
  track_latency: true
  track_errors: true

# Arbitrage settings (placeholder - not functional in MVP)
arbitrage:
  # Minimum profit threshold (percentage)
  min_profit_threshold: 0.5
  # Maximum slippage tolerance (percentage)
  max_slippage: 0.3
  # Trade amount limits
  min_trade_amount: 10
  max_trade_amount: 10000

# Risk management settings (placeholder - not functional in MVP)
risk:
  # Maximum position size per trade
  max_position_size: 1000
  # Daily loss limit
  daily_loss_limit: 500
  # Enable risk checks
  enable_risk_checks: true
